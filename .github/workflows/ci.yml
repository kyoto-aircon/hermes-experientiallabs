name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Offline suite (integration/live are deselected by pyproject addopts).
    # The tests import the real Hermes packages, so each run clones
    # hermes-agent and syncs its locked dependency set (the same uv flow
    # Hermes' own CI uses), then runs pytest from the plugin checkout.
    name: pytest (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HERMES_AGENT_ROOT: ${{ runner.temp }}/hermes-agent
    steps:
      - uses: actions/checkout@v5

      - name: Clone hermes-agent (declared floor release)
        # requires_hermes is ">=0.21.6": test against that release, not main,
        # so CI proves the floor the manifest declares.
        run: git clone --depth 1 --branch v0.21.6 https://github.com/NousResearch/hermes-agent.git "$HERMES_AGENT_ROOT"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "${{ runner.temp }}/hermes-agent/uv.lock"

      - name: Sync hermes-agent environment
        # Python 3.14: Hermes pins its core dependencies for 3.14 only.
        # The dev group provides pytest; the core group provides httpx,
        # ruamel.yaml and everything the plugin's import chain needs.
        run: uv sync --locked --python 3.14 --group dev
        working-directory: ${{ env.HERMES_AGENT_ROOT }}

      - name: Run plugin tests
        run: "$HERMES_AGENT_ROOT/.venv/bin/python" -m pytest
